services:
  postgres:
    container_name: ma_postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: motion_analysis
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
    ports:
      - "5432:5432"
    volumes:
      - motion_analysis_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion -d motion_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motion_analysis_pg:
